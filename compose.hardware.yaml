# Hardware overlay — 僅於實際連接硬體之運算平台使用。
#
#   docker compose -f compose.yaml -f compose.hardware.yaml up
#
# compose.yaml 為平台中立之開發環境設定，不綁定任何實機裝置節點，
# 使開發機（無對應硬體）可直接建置與進入容器。
# 本檔以疊加方式補上實機裝置節點。

services:
  mobile_base:
    devices:
      # SUB-001 Base Control: RS-485 (DEXMART M1C-N016RE ×2 / Modbus Multi-drive 2.0)
      - /dev/ttyUSB0:/dev/ttyUSB0
