# S3 State Estimation Subsystem EKF configuration using robot_localization.
# Fuses wheel odometry (/diff_drive_controller/odom) and IMU (/imu/data_raw).
# Publishes /odometry/filtered and acts as the sole authority for odom -> base_footprint TF.

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false #true
    publish_tf: true
    publish_acceleration: false

    map_frame: "map"
    odom_frame: "odom"
    base_link_frame: "base_footprint"
    world_frame: "odom"

    # odom0: Wheel odometry from diff_drive_controller
    # Fuses only forward velocity vx.
    # Wheel x, y, yaw, and yaw rate (vyaw) are excluded.
    odom0: "/diff_drive_controller/odom"
    odom0_config:
      [
        false, false, false,   # x, y, z
        false, false, false,   # roll, pitch, yaw
        true,  true, false,   # vx, vy, vz
        false, false, false,   # vroll, vpitch, vyaw
        false, false, false    # ax, ay, az
      ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # imu0: TDK 6-axis IMU from mobile_base_perception
    # The current EKF baseline intentionally fuses only IMU angular_velocity.z.
    # IMU orientation fusion may be evaluated later after runtime verification of orientation validity, reference, and covariance.
    # Linear acceleration is excluded to avoid drift from vibration and accelerometer bias.
    imu0: "/imu/data_raw"
    imu0_config:
      [
        false, false, false,   # x, y, z
        false, false, false,   # roll, pitch, yaw
        false, false, false,   # vx, vy, vz
        false, false, true,    # vroll, vpitch, vyaw (wz)
        false, false, false    # ax, ay, az
      ]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
