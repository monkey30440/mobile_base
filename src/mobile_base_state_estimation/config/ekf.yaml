#
# S3 State Estimation Subsystem EKF configuration using robot_localization.
# Fuses Kinematic-ICP planar pose (odom0) and TDK IMU yaw rate (imu0).
# Wheel odometry is already incorporated by Kinematic-ICP as its motion prior.
# Publishes /odometry/filtered and acts as the sole authority for odom -> base_footprint TF.

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    publish_tf: true
    publish_acceleration: false

    map_frame: "map"
    odom_frame: "odom"
    base_link_frame: "base_footprint"
    world_frame: "odom"

    # odom0: Kinematic-ICP laser odometry (fusing planar pose: x, y, yaw)
    odom0: "/lidar_odometry"
    odom0_config:
      [
        true,  true,  false,   # x, y, z
        false, false, true,    # roll, pitch, yaw
        false, false, false,   # vx, vy, vz
        false, false, false,   # vroll, vpitch, vyaw
        false, false, false    # ax, ay, az
      ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # imu0: S2 TDK IMU (fusing yaw_rate only; orientation strictly excluded)
    imu0: "/imu/data_raw"
    imu0_config:
      [
        false, false, false,
        false, false, false,
        false, false, false,
        false, false, true,    # yaw rate
        false, false, false    # no acceleration
      ]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
