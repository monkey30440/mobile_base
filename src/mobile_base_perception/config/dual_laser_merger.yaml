# Dual Laser Merger parameter configuration for S2 Perception Subsystem.
# Merges Front-Left and Rear-Right SICK picoScan150 LaserScans into a unified 360-degree LaserScan.

dual_laser_merger_node:
  ros__parameters:
    laser_1_topic: "/scan_front"
    laser_2_topic: "/scan_rear"
    target_frame: "base_link"
    merged_scan_topic: "/scan"
    merged_cloud_topic: "/sick_internal/merged_cloud"
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.0058171823974636  # ~1080 points over 2*pi (0.333 deg resolution)
    scan_time: 0.04
    range_min: 0.05
    range_max: 25.0
    min_height: -1.0
    max_height: 1.0
    tolerance: 0.05
    allowed_radius: 0.20
    use_inf: true
    inf_epsilon: 1.0
