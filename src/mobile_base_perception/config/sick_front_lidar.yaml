# S2 Perception Subsystem: Front-Left SICK picoScan150 2D LiDAR Configuration
# Device: SICK picoScan150 at 192.168.0.1 (Front-Left Mounting Pocket)
# Host Receiver: 192.168.0.100 (Jetson enP2p1s0 interface)
# UDP Receive Port: 2115 (Scan Data) / 7503 (IMU Data)
# SOPAS TCP Port: 2111 (Configuration & Start/Stop Negotiation)
# Target Frame: base_lidar_link_FL
# Full-frame LaserScan Output: /scan_front (sensor_msgs/msg/LaserScan)

front_lidar_node:
  ros__parameters:
    scanner_type: "sick_picoscan"
    hostname: "192.168.0.1"
    udp_receiver_ip: "192.168.0.100"
    udp_port: 2115
    check_udp_receiver_ip: false
    imu_udp_port: 7503
    sopas_tcp_port: "2111"
    nodename: "front_lidar_node"
    publish_frame_id: "base_lidar_link_FL"
    publish_laserscan_fullframe_topic: "/scan_front"
    publish_laserscan_segment_topic: "/scan_segment_front"
    tf_publish_rate: 0.0  # TF authority owned by S1 robot_state_publisher
    all_segments_min_deg: -138.0  # 276 deg native aperture (-138 to +138 deg)
    all_segments_max_deg: 138.0
    send_sopas_start_stop_cmd: true
    scandataformat: 2  # 2 = compact scandata
    sw_pll_only_publish: true
    verbose_level: 1
