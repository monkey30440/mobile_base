# S5 Localization: Localization Monitor configuration for Mobile Base (SYS-045 Phase 1)
# NOTE: These candidate defaults follow reference design values and are NOT production-validated.
# Thresholds and hold durations require future simulation and hardware tuning.

localization_monitor:
  ros__parameters:
    match_dist_m: 0.15
    occupied_threshold: 65
    min_valid_beams: 30
    beam_stride: 1
    lost_ratio: 0.35
    recover_ratio: 0.60
    lost_hold_s: 1.5
    recover_hold_s: 1.5
    tf_timeout_s: 0.1
