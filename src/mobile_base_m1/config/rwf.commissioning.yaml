# RWF target facts: saved user-supplied PELB profiles + bounded live FC03 reads,
# 2026-10-02; see docs/validation/m1-software.md for provenance and applicability.
# Radius0.08m/separation0.555m/gear20:1 are operator-confirmed nominal geometry.
# COMMISSIONING ONLY: engineering settings, not validated production limits.
# Activation can issue ISTOP/SVON/SVOFF; use only after reviewed operator conditions.
# 1RPM/count is the documented velocity register unit, not encoder pulse scale.
# Live state6 is inhibited; watchdog05-17=0. No persistent parameter was written; later zero-speed gate is documented separately.
hardware:
  serial_port: /dev/fihRobotBaseMotor
  firmware: "UNIDENTIFIED; bounded commissioning only"
  baud: 230400
  parity: N
  stop_bits: 1
  response_timeout_seconds: 0.05
  enable_timeout_seconds: 0.3
  verified_multidrive2: true
  verified_speed_mode: true
  pdo_mapping: 0
  drive_enable_setting: 1
  left_drive_id: 2
  right_drive_id: 1
  left_gear_ratio: 20.0
  right_gear_ratio: 20.0
  left_direction: 1.0
  right_direction: -1.0
  left_feedback_rpm_per_count: 1.0
  right_feedback_rpm_per_count: 1.0
  left_max_motor_rpm: 150.0
  right_max_motor_rpm: 150.0
controller:
  wheel_radius: 0.08
  wheel_separation: 0.555
  cmd_vel_timeout: 0.3
  update_rate: 20
  linear_velocity_limit: 0.03
  angular_velocity_limit: 0.10
  # Native synchronous RS485 execution budget; microseconds, engineering only.
  # Mean/stddev alarms are statistical thresholds, not hard deadlines/WCET.
  native_hardware_execution_budget_us:
    mean_warn: 15000.0
    mean_error: 20000.0
    stddev_warn: 3000.0
    stddev_error: 5000.0
