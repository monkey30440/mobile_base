services:
  mobile_base:
    build:
      context: .
      dockerfile: Dockerfile
      
    restart: unless-stopped

    container_name: mobile_base
    runtime: nvidia
    network_mode: host

    env_file:
      - .env

    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - TOPIC_NAMESPACE=${TOPIC_NAMESPACE}

    volumes:
      - .:/workspaces/mobile_base
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0

    working_dir: /workspaces/mobile_base

    stdin_open: true
    tty: true

    command: sleep infinity

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --insecure
          --user admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
          'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          >/dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  influxdb:
    image: influxdb:2.9.1
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?set INFLUXDB_INIT_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-mobile_base}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-observability}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?set INFLUXDB_INIT_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8086/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  opensearch-data:
  influxdb-data:
