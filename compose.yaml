services:
  mobile_base:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobile_base:latest
    container_name: mobile_base
    runtime: nvidia
    network_mode: host
    ipc: host
    # 本檔為平台中立之開發環境，不綁定實機裝置節點。
    # 於實際連接硬體之運算平台執行時，加掛 compose.hardware.yaml：
    #   docker compose -f compose.yaml -f compose.hardware.yaml up
    volumes:
      - ./src:/workspace/src
      - ./maps:/workspace/maps
    environment:
      - ROS_DOMAIN_ID=77
    working_dir: /workspace
    stdin_open: true
    tty: true
